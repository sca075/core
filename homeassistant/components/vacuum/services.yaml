# Describes the format for available vacuum services

turn_on:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.TURN_ON

turn_off:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.TURN_OFF

toggle:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.TURN_OFF
        - vacuum.VacuumEntityFeature.TURN_ON

stop:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.STOP

locate:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.LOCATE

start_pause:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.PAUSE

start:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.START

pause:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.PAUSE

return_to_base:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.RETURN_HOME

clean_spot:
  target:
    entity:
      domain: vacuum

send_command:
  target:
    entity:
      domain: vacuum
  fields:
    command:
      required: true
      example: "set_dnd_timer"
      selector:
        text:
    params:
      example: '{ "key": "value" }'
      selector:
        object:

set_fan_speed:
  target:
    entity:
      domain: vacuum
  fields:
    fan_speed:
      required: true
      example: "low"
      selector:
        text:

set_cleaning_mode:
  target:
    entity:
      domain: vacuum
  fields:
    cleaning_mode:
      required: true
      example: "Vacuuming"
      selector:
        text:

set_mop_intensity:
  target:
    entity:
      domain: vacuum
  fields:
    mop_intensity:
      required: true
      example: "Moist"
      selector:
        text:

start_auto_empty:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.AUTO_EMPTY

start_mop_drying:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.DRYING_MOP

start_mop_cleaning:
  target:
    entity:
      domain: vacuum
      supported_features:
        - vacuum.VacuumEntityFeature.MOP_CLEANING
